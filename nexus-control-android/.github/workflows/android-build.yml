name: Android build

on:
  push:
    paths:
      - 'nexus-control-android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'nexus-control-android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-control-android
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --no-daemon

      - name: Ejecutar pruebas unitarias
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: nexus-obsidian-control-debug
          path: nexus-control-android/app/build/outputs/apk/debug/app-debug.apk
