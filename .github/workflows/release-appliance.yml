name: release-appliance

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-appliance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6399:6379
    defaults:
      run:
        working-directory: nexus-control-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nexus-control-api/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-control-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexus-control-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  publicar:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcular etiquetas
        id: etiquetas
        run: |
          propietario=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          corto=${GITHUB_SHA::7}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            extra_api="ghcr.io/$propietario/nexus-api:stable"$'\n'"ghcr.io/$propietario/nexus-api:${GITHUB_REF_NAME}"
            extra_web="ghcr.io/$propietario/nexus-web:stable"$'\n'"ghcr.io/$propietario/nexus-web:${GITHUB_REF_NAME}"
          else
            extra_api="ghcr.io/$propietario/nexus-api:edge"
            extra_web="ghcr.io/$propietario/nexus-web:edge"
          fi
          {
            echo "api<<FIN"
            echo "ghcr.io/$propietario/nexus-api:$corto"
            echo "$extra_api"
            echo "FIN"
            echo "web<<FIN"
            echo "ghcr.io/$propietario/nexus-web:$corto"
            echo "$extra_web"
            echo "FIN"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: nexus-control-api
          file: nexus-control-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.etiquetas.outputs.api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/appliance/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.etiquetas.outputs.web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
