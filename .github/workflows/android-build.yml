name: android-build

on:
  push:
    paths:
      - 'nexus-control-android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'nexus-control-android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-control-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK de depuracion
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-obsidian-control-android-debug
          path: nexus-control-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
